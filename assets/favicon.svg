<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    xguard favicon, 16-32 px cut of the lifted x.
    Tile: ink-0 rounded square (radius 12/64 = 3px at 16px). Mark: paper, inset to a 40-unit box
    so the strokes stay 2 px at 16 px; the point is 2 px; the gap along the axis is about 2.5 px.
    Colors are hard-coded on purpose: a favicon cannot inherit currentColor.
  -->
  <rect width="64" height="64" rx="12" fill="#0A0A0B"/>
  <path d="M18 18L46 46M18 46L33 31" fill="none" stroke="#EDEBE6" stroke-width="8" stroke-linecap="butt"/>
  <rect x="40" y="16" width="8" height="8" fill="#EDEBE6"/>
</svg>
