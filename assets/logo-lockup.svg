<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-labelledby="xguard-lockup-title">
  <title id="xguard-lockup-title">xguard</title>
  <!--
    xguard horizontal lockup: mark (64 units) + gap (32 units, half the mark height) + wordmark.
    Wordmark: Geist 500, uppercase, letter-spacing 0.16em, cap height centered on the mark's box center (y=32).
    The wordmark is live text; as an <img> the fallback stack renders. On a page, rebuild the lockup inline.
    Color: currentColor only. Never the red pen.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@500&amp;display=swap');
    .wordmark { font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 40px; letter-spacing: 6.4px; fill: currentColor; }
  </style>
  <g fill="none">
    <path d="M12 12L52 52M12 52L34 30" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/>
    <rect x="44" y="12" width="8" height="8" fill="currentColor"/>
  </g>
  <text class="wordmark" x="96" y="46.2">XGUARD</text>
</svg>
