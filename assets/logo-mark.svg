<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="xguard-mark-title">
  <title id="xguard-mark-title">xguard</title>
  <!--
    xguard mark: "the lifted x".
    A lowercase x set as two strokes of type. The top-right arm is lifted out and held
    as a single square point on its own axis: the cross is not finished until you place it.
    Geometry (64-unit grid, stroke 8, butt caps):
      backslash centerline (12,12) to (52,52), the full diagonal of the 40-unit square
      slash centerline (12,52) to (34,30): it crosses the center and stops one half-stroke past it
      point 8x8 at x 44..52, y 12..20, centered on (48,16), on the slash's axis
      gap along the axis from the slash's cap to the point's corner: 14 units (3.5 px at 16 px)
    Every coordinate on a 2-unit grid. Color: currentColor only. Never the red pen.
  -->
  <path d="M12 12L52 52M12 52L34 30" stroke="currentColor" stroke-width="8" stroke-linecap="butt"/>
  <rect class="point" x="44" y="12" width="8" height="8" fill="currentColor"/>
</svg>
