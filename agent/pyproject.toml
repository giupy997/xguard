[project]
name = "xguard"
version = "0.1.0"
description = "An always-on security agent for your Mac. It watches continuously; you decide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.17",
]

[project.scripts]
xguard = "xguard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
